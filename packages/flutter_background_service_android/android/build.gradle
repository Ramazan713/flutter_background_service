group 'id.flutter.flutter_background_service'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

def backgroundServiceTestMinSdkVersion = project.findProperty('flutterBackgroundServiceTestMinSdk')

android {
    compileSdkVersion 36

    namespace = "id.flutter.flutter_background_service"
    
    defaultConfig {
        minSdkVersion backgroundServiceTestMinSdkVersion == null ? 16 : backgroundServiceTestMinSdkVersion.toInteger()
        consumerProguardFiles 'proguard-rules.pro'
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'user.language', 'en'
            systemProperty 'user.country', 'US'
        }
    }
}

dependencies {
  implementation "androidx.core:core:1.12.0"
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.16.1'
}
